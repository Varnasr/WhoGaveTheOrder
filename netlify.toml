[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"

# ---- the four pages removed on 2026-09-23 ----
# chain.html mapped eight offices with the authority to order force and no
# document placing any of them behind any incident; walkthrough.html was a
# nine-step manual for reading nineteen records; admin.html published an
# editorial console; response.html held zero official replies. Each was a
# furnished room with nothing in it, and between them they took two of the
# seven primary navigation slots while the one thing a reader can act on sat
# in the footer. 301 rather than delete, because they have been linked to.
[[redirects]]
  from = "/chain.html"
  to = "/investigations.html"
  status = 301

[[redirects]]
  from = "/response.html"
  to = "/investigations.html"
  status = 301

[[redirects]]
  from = "/walkthrough.html"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/admin.html"
  to = "/about.html"
  status = 301

# ---- incident pages are static files now --------------------------------------
# investigation.html?id=<slug> was filled in by the browser, so a crawler and a
# link preview saw one page for every incident. Each incident has its own page,
# incident/<slug>.html, written by tools/build-seo.js. Old links and any that
# were already shared keep working: a request with an id is sent to the page.
[[redirects]]
  from = "/investigation.html"
  query = {id = ":id"}
  to = "/incident/:id.html"
  status = 301
  force = true

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---- the source map is committed, not published ----
# sourcemap/ holds the research behind the archive, including the filing queue:
# which office is about to be written to, on what deadline, and where no court
# has ordered preservation. The offices it concerns should not be able to read
# it off the website. It stays in git for the audit trail.
[[redirects]]
  from = "/sourcemap/*"
  to = "/"
  status = 404
  force = true
