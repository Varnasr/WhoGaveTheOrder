# The integrity checks, on every push.
#
# These checks have existed since the archive was built, in admin.html, but they
# only ran when somebody opened the console and looked. A dangling reference in
# an accountability archive is a claim pointing at nothing, and it should not be
# possible to merge one without being told.
#
# Nothing here installs a dependency: the site has none, and the tooling loads
# the site's own model rather than reimplementing it.

name: Integrity

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: the generated-files check below runs tools/build.js, which
      # needs every commit that touched data/ to rebuild the change log.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Record integrity: the model's own checks
        run: node tools/check.js

      - name: Source map validation
        run: python3 sourcemap/validate.py

      # Everything generated is committed, so any of it can drift from the data it
      # was built out of. Regenerating and diffing is the only way to know the
      # published site matches what it claims to be built from.
      #
      # This used to run the import alone, which left the build's outputs: the
      # change log, the Atom feed and data/export/: checked by nothing at all,
      # while the README said CI failed if either was stale. It did not: the
      # change log was wrong for weeks and every run here was green.
      - name: Generated records are current
        run: |
          python3 sourcemap/import.py
          if ! git diff --quiet; then
            echo "::error::data/records.generated.js is stale. Run 'python3 sourcemap/import.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      # letters.html composes from data/letters.generated.js, which is parsed out
      # of correspondence/*.md. If those drift, the page mails a letter the
      # repository does not hold, and nothing on screen would show it.
      - name: The preservation letters match correspondence/
        run: node tools/build-letters.js --check

      # Not run on a push to main: see the reconcile job below for why a squash
      # merge makes this check fail on main for a reason no human can fix.
      - name: Change log, feed and export are current
        if: github.ref != 'refs/heads/main'
        run: |
          node tools/build.js
          if ! git diff --quiet; then
            echo "::error::Generated output is stale. Run 'node tools/build.js' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  # The change log is derived from git history, and a squash merge destroys the
  # history it was derived from.
  #
  # On a branch, tools/build.js sees each commit that touched data/ and writes
  # an entry for it. GitHub's squash merge collapses those into one commit on
  # main, so running the same script on main produces a different and shorter
  # log (97 deleted lines after PR #33), and the gate above failed with an
  # instruction nobody could carry out: run build.js and commit the result,
  # where doing exactly that is what produces the diff.
  #
  # It fired on #31, on #33 and on main, three times in one day, and every time
  # it was read as a mistake somebody had made. It is not. The log on main
  # should describe main's history, and main's history is whatever the merge
  # produced, so the correct response to the difference is to write it down
  # rather than to ask a person to.
  #
  # The gate keeps its teeth everywhere it can still mean something: on a pull
  # request and on any branch, a stale generated file is a real thing a
  # contributor forgot, and it still fails.
  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Rebuild the change log against main's own history
        run: node tools/build.js

      - name: Commit it if it moved
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo "change log already matches main's history"
          else
            git --no-pager diff --stat
            git add -A
            # [skip ci] so this does not trigger itself.
            git commit -m "Rebuild the change log against main's history after the merge [skip ci]"
            git push
          fi
