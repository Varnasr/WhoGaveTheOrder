# The daily sweep.
#
# Goes to the places a document about these incidents could appear and reports
# what is new. It opens an issue when there is something to look at, and it
# commits the log every day whether or not there was: because "we looked on
# this date and found nothing" is a finding in this archive, and an undated
# absence is worth much less than a dated one.
#
# It never writes a record. A person decides what becomes evidence and at what
# confidence; see the header of tools/sweep.js for why that line is drawn there.

name: Sweep

on:
  schedule:
    # 02:30 UTC: 08:00 in India, so the candidates are waiting at the start of
    # the day and an hour before the deadline robot runs.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0, not the default 1. tools/build.js derives the change log
      # by diffing each commit against its parent, and in a shallow clone the
      # boundary commit reports no parent, so every record reads as added by it.
      # This job ran at depth 1 and committed the result with [skip ci]: the
      # published history became one entry claiming a sweep-log commit created
      # the whole archive. build.js now refuses to run shallow, so getting this
      # wrong fails the job instead of publishing a false history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Cause lists are PDFs. Without a reader the sweep still detects that the
      # file changed, but cannot say which term matched, so it is worth the
      # twenty seconds to install one.
      - name: PDF reader
        run: pip install --quiet pypdf

      - name: Run the sweep
        id: sweep
        # ONE run. Two runs meant the first consumed the novelty and the second,
        # whose JSON the issue is opened from, found nothing by construction.
        # See the comment at the top of tools/sweep.js.
        run: node tools/sweep.js --json-file sweep.json | tee sweep.txt

      # Get the day's sources into a public web archive. Capped, because the
      # Internet Archive throttles, and it does not matter if this takes a week
      # to work through a backlog.
      - name: Archive the sources
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          node tools/fixity.js --limit 12 || echo "fixity did not finish; the backlog keeps"
          python3 sourcemap/import.py
          node tools/build.js

      - name: Record that we looked
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- sourcemap/ data/; then
            echo "nothing to record"
          else
            git add sourcemap/ data/
            # [skip ci] so a log commit does not re-run the integrity checks on
            # a file no check reads.
            git commit -m "Sweep log and archived copies for $(date -u +%Y-%m-%d) [skip ci]"
            # build.js derives the change log from commits, so the run above
            # could not include the commit just made, and feed.xml sits outside
            # sourcemap/ and data/. Left there, main was one entry behind after
            # every sweep and the change-log gate failed on every branch cut from
            # it. A rebuild after the commit catches up; a second rebuild after
            # that changes nothing (checked 2026-10-19).
            node tools/build.js
            if ! git diff --quiet; then
              git add -A
              git commit -m "Change log and feed for the $(date -u +%Y-%m-%d) sweep [skip ci]"
            fi
            git push
          fi

      - name: Raise the candidates
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('sweep.json', 'utf8'));
            const findings = report.findings || [];
            const date = report.run.date;

            const unreachable = findings.filter(f => f.kind === 'UNREACHABLE');
            const items = findings.filter(f => f.kind !== 'UNREACHABLE');

            if (!items.length && !unreachable.length) {
              core.info('Nothing new. The log records that we looked.');
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: 'sweep'
              });
            } catch (err) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'sweep', color: '3d8dc4',
                description: 'Candidates found by the daily sweep. Not records.'
              });
            }

            const lines = [];
            lines.push('These are **candidates, not records.** Nothing here has a state, a source ID or a place in the archive until a person puts it there. Check the document, decide what it establishes and what it does not, then add it through the normal route.');
            lines.push('');

            if (items.length) {
              lines.push(`## ${items.length} to look at`);
              lines.push('');
              for (const f of items) {
                if (f.kind === 'BASELINE_TRIMMED') { lines.push(`- _${f.detail}_`); continue; }
                lines.push(`- **${f.title || f.label}**`);
                if (f.url) { lines.push(`  ${f.url}`); }
                if (f.terms) { lines.push(`  matched: ${f.terms.join(', ')}`); }
                if (f.snippets) { f.snippets.forEach(s => lines.push(`  > ${s}`)); }
                if (f.note) { lines.push(`  _why this is watched: ${f.note}_`); }
                lines.push('');
              }
            }

            if (unreachable.length) {
              lines.push('## Could not be reached');
              lines.push('');
              lines.push('Recorded rather than retried silently. "We could not look" is not the same as "we looked and it was empty", and the archive should not blur them.');
              lines.push('');
              for (const f of unreachable) {
                lines.push(`- **${f.label}**: ${f.detail}`);
                lines.push(`  ${f.url}`);
              }
              lines.push('');
            }

            lines.push('---');
            lines.push('_Generated by [Claude Code](https://claude.ai/code)_');

            const title = `Sweep ${date}: ${items.length} candidate(s)`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sweep'
            });
            const existing = open.data.find(i => i.title.startsWith(`Sweep ${date}`));
            const body = lines.join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sweep']
              });
            }
