# The deadline robot.
#
# The RTI register computes its clocks in the browser, which means a deadline is
# only noticed if somebody happens to load the page on the right day. An office
# that stays silent past the statutory period has, under section 7(2), refused —
# and the appeal that opens has its own thirty-day clock running against it.
#
# So the clocks run here too, every morning, and anything that has tipped over
# becomes an issue with the record ID and the next action in it.

name: Deadlines

on:
  schedule:
    # 03:30 UTC — early morning in India, so the issue is waiting at the start
    # of the working day rather than arriving in the middle of it.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deadlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the clocks
        id: clocks
        run: |
          node tools/deadlines.js
          node tools/deadlines.js --json > deadlines.json

      - name: Open or update the issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('deadlines.json', 'utf8'));
            const findings = report.findings || [];
            const title = 'RTI deadlines: action needed';

            // One open issue, updated, rather than a new one every morning. A
            // daily issue for the same unanswered application would train
            // everyone to ignore the notification.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deadlines'
            });
            const issue = existing.data.find(i => i.title === title);

            if (!findings.length) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                  body: 'Every application in the register is inside its period, and no appeal window is closing. Closing this until something tips over again.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                  state: 'closed'
                });
              }
              core.info('Nothing has tipped over a deadline.');
              return;
            }

            const lines = findings.map(f => {
              const bits = ['- **' + f.headline + '**'];
              if (f.office) { bits.push('  ' + f.office); }
              if (f.subject) { bits.push('  _' + f.subject + '_'); }
              if (f.action) { bits.push('  → ' + f.action); }
              return bits.join('\n');
            });

            const body = [
              'The register\'s clocks were run against ' + report.checkedApplications +
                ' published application(s). These have tipped over:',
              '',
              lines.join('\n\n'),
              '',
              '---',
              'A deemed refusal is not a gap in the archive. It is a recorded fact about a public office, ' +
                'with a date on it, and the appeal it opens has its own clock.',
              '',
              '_Generated by [Claude Code](https://claude.ai/code)_'
            ].join('\n');

            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['deadlines']
              });
            }
